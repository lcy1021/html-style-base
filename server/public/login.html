<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · 经验库后台</title>
<style>
:root{color-scheme:dark;--bg:#0c0b12;--panel:#16151d;--line:rgba(255,255,255,.1);--ink:#f3f1ff;--mut:#9a95a8;--amber:#ffb547}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.box{width:min(360px,92vw);padding:36px 32px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.eb{font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
h1{margin:6px 0 22px;font-size:22px;font-weight:500}
.btn{display:flex;justify-content:center;align-items:center;width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:var(--ink);color:#111;border-color:var(--ink)}
.btn.pri:hover{background:#fff}
input{width:100%;height:42px;margin-bottom:10px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.25);color:var(--ink);font:inherit}
input:focus,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.or{margin:16px 0;text-align:center;color:var(--mut);font-size:12px}
.msg{margin:0 0 16px;padding:10px 12px;border-radius:8px;background:rgba(255,120,120,.12);color:#ffb3b3;font-size:13px}
</style>
</head>
<body>
<main class="box">
  <div class="eb">HTML Style Base</div>
  <h1>经验库后台</h1>
  <!--MSG--><!--NONE-->
  <!--GH-->
  <!--PW-->
</main>
</body>
</html>
