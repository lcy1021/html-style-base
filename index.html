<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Style Base · 设计经验库</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#0e0d14;--ink:#f3f1ff;--ink2:#b9b5c7;--mut:#7f7b8e;--line:rgba(255,255,255,.09);--accent:#ff8a5b;--serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:26px 26px}
.hero{background:radial-gradient(60% 120% at 15% 0%,rgba(255,138,91,.10),transparent 60%),radial-gradient(50% 100% at 90% 10%,rgba(185,168,255,.10),transparent 60%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;font-size:13px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.01em}
.brand span{color:var(--mut)}
.search{display:flex;align-items:center;gap:10px;width:300px;height:38px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.04);transition:border-color .2s,background .2s}
.search:focus-within{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:13px;color:var(--ink)}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* 头图 */
.hero{display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:end;padding:64px 48px 52px;border-bottom:1px solid var(--line)}
.eb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:22px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,6.2vw,92px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero aside{font-size:14px;line-height:1.85;color:var(--ink2);text-wrap:pretty}
.hero aside .stats{display:flex;gap:28px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.hero aside .stats div{font-size:12px;color:var(--mut)}
.hero aside .stats b{display:block;font-family:var(--serif);font-size:30px;font-weight:900;color:var(--ink);line-height:1.1}

/* 筛选 */
.filters{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:14px 48px;background:rgba(14,13,20,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.chip{height:32px;padding:0 14px;border-radius:99px;font-size:13px;color:var(--ink2);border:1px solid transparent;transition:all .2s var(--ease)}
.chip sup{font-family:var(--mono);font-size:10px;margin-left:4px;color:var(--mut)}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] sup{color:rgba(14,13,20,.55)}

/* 卡片网格 */
main{padding:36px 48px 96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:44px 26px}
.card{display:block;position:relative}
.cover{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#0c0b12;box-shadow:0 0 0 1px rgba(255,255,255,.08);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.card:hover .cover{transform:translateY(-4px);box-shadow:0 24px 48px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.18)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;transition:opacity .35s}
.cover iframe{position:absolute;left:0;top:0;width:960px;height:600px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .35s}
.cover.live iframe{opacity:1}
.cover.live img{opacity:0}
.cover .txt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px;background:#1a1824;color:var(--ink)}
.cover .txt b{font-family:var(--serif);font-size:30px;font-weight:900;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.cover .txt small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mut)}
.meta{display:flex;align-items:baseline;gap:12px;margin-top:16px}
.no{font-family:var(--mono);font-size:12px;color:var(--accent)}
.meta h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.meta .cat{margin-left:auto;font-size:12px;color:var(--mut)}
.intent{margin-top:6px;font-size:13.5px;line-height:1.65;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:12px}
.empty{padding:80px 0;text-align:center;color:var(--mut)}
footer{padding:28px 48px 40px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;justify-content:space-between}

@media (max-width:860px){.top,.hero,.filters,main,footer{padding-left:20px;padding-right:20px}.hero{grid-template-columns:1fr}.search{width:180px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><b>HTML Style Base</b><span>UED · 设计经验库</span></a>
  <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜形式、意图、踩过的坑…" aria-label="搜索"><kbd>/</kbd></label>
</header>

<section class="hero">
  <div>
    <div class="eb">VOL.01 · 持续更新</div>
    <h1>做 HTML 演示之前，<br>先来这里<em>看一眼</em>。</h1>
  </div>
  <aside>
    按“想让听众明白什么”来找展示形式。卡片里的样例会自己循环演示；点进去可以亲手操作，按 <b>I</b> 看说明和 DESIGN.md。
    <div class="stats"><div><b id="nAll">0</b>条经验</div><div><b id="nDemo">0</b>个样例</div><div><b id="nCat">0</b>个分类</div></div>
  </aside>
</section>

<nav class="filters" id="filters" aria-label="分类"></nav>
<main><div class="grid" id="grid"></div></main>
<footer><span>样例内容均已去业务化 · 示意数据会在页面上标注</span><span>原型 v0.1</span></footer>

<script src="data/patterns.js"></script>
<script src="data/live.js"></script>
<script>
(() => {
  const P = (window.PATTERNS || []).map((p, i) => ({...p, no: String(i + 1).padStart(2, '0')}));
  const ORDER = ['案例场景', '案例展示', '页面过渡', '文字布局', '讲法', '外部参考', '工程与交付'];
  const cats = ORDER.filter(c => P.some(p => p.category === c));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const base = d => d ? d.replace(/^demos\//, '').replace(/\.html$/, '') : '';
  document.getElementById('nAll').textContent = P.length;
  document.getElementById('nDemo').textContent = new Set(P.filter(p => p.demo).map(p => p.demo)).size;
  document.getElementById('nCat').textContent = cats.length;

  const filters = document.getElementById('filters'), grid = document.getElementById('grid'), q = document.getElementById('q');
  let cur = '全部';
  ['全部', ...cats].forEach(c => {
    const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
    b.innerHTML = `${esc(c)}<sup>${c === '全部' ? P.length : P.filter(p => p.category === c).length}</sup>`;
    b.setAttribute('aria-pressed', String(c === cur));
    b.onclick = () => { cur = c; filters.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); };
    filters.appendChild(b);
  });
  q.oninput = render;
  addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } if (e.key === 'Escape') q.blur(); });

  function render() {
    const k = q.value.trim().toLowerCase();
    const list = P.filter(p => (cur === '全部' || p.category === cur) && (!k || [p.title, p.intent, p.summary, ...(p.tags || []), ...(p.pitfalls || [])].join(' ').toLowerCase().includes(k)));
    io && io.disconnect && grid.querySelectorAll('.card').forEach(c => c._stop && c._stop()); io && io.disconnect();
    grid.innerHTML = list.length ? list.map(p => `
      <a class="card" href="view.html#${encodeURIComponent(p.id)}" data-demo="${esc(p.demo || '')}">
        <div class="cover">${p.demo
          ? `<img src="covers/${esc(base(p.demo))}.jpg" alt="" loading="lazy">`
          : `<div class="txt"><small>文字经验 · ${esc(p.category)}</small><b>${esc(p.title)}</b></div>`}</div>
        <div class="meta"><span class="no">#${p.no}</span><h3>${esc(p.title)}</h3><span class="cat">${esc(p.category)}</span></div>
        <p class="intent">${esc(p.intent)}</p>
      </a>`).join('') : '<p class="empty">没有找到，换个关键词试试。</p>';
    grid.querySelectorAll('.card[data-demo]:not([data-demo=""])').forEach(c => { if (!window.LIVE || window.LIVE.includes(base(c.dataset.demo))) bind(c); });
  }

  /* 卡片在视口里就自动循环播放步骤 */
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? e.target._play() : e.target._stop()), {threshold: .35});
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function bind(card) {
    if (reduce) return;
    const cov = card.querySelector('.cover');
    let wait, timer, fr;
    const fit = () => { if (fr) fr.style.transform = `scale(${cov.clientWidth / 960})`; };
    const stop = () => { clearTimeout(wait); clearTimeout(timer); cov.classList.remove('live'); if (fr) { const f = fr; fr = null; setTimeout(() => f.remove(), 350); } };
    const start = () => {
      fr = document.createElement('iframe'); fr.src = card.dataset.demo; fr.tabIndex = -1; fr.title = '';
      cov.insertBefore(fr, cov.firstChild); fit();
      fr.onload = () => {
        const f = fr; if (!f) return;
        const w = f.contentWindow, d = f.contentDocument;
        try {
          const st = d.createElement('style'); st.textContent = '.ctrl{display:none!important}.stage{bottom:0!important}'; d.head.appendChild(st);
          const N = w.DEMO ? w.DEMO.N : 1;
          let k = 0;
          const show = () => { if (w.DEMO) w.DEMO.set(k); };
          show(); cov.classList.add('live');
          const tick = () => {
            if (!fr) return;
            if (k >= N - 1) {            // 播完一轮：淡出 → 回到第 1 步 → 淡入，继续循环
              f.style.opacity = 0;
              timer = setTimeout(() => { k = 0; show(); f.style.opacity = ''; timer = setTimeout(tick, 1400); }, 380);
            } else { k++; show(); timer = setTimeout(tick, k >= N - 1 ? 2400 : 1400); }
          };
          timer = setTimeout(tick, 1400);
        } catch (e) { cov.classList.add('live'); }
      };
    };
    // 进入视口就自动循环播放，离开视口就停，不需要悬停
    card._play = () => { if (!fr) { clearTimeout(wait); wait = setTimeout(start, 150 + Math.random() * 500); } };
    card._stop = stop;
    io.observe(card);
    addEventListener('resize', fit);
  }
  render();
  // 兼容旧版链接 index.html#id → 详情页
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && P.some(p => p.id === h)) location.replace('view.html#' + encodeURIComponent(h));
})();
</script>
</body>
</html>
