<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清单逐条打勾</title><link rel="stylesheet" href="demo.css">
<style>
.side{position:absolute;left:34px;top:46%;width:30vw;transform:translateY(-50%)}.side h2{font-size:26px;font-weight:400;line-height:1.3}.side h2 em{font-style:normal;color:#5b3fd6}.side p{margin-top:10px;color:#4e5969;font-size:14px;line-height:1.8}
.card{position:absolute;right:34px;top:46%;width:min(560px,56vw);transform:translateY(-50%);padding:22px 26px;border-radius:18px;background:#fff;box-shadow:0 24px 60px rgba(29,33,41,.12)}
.hd{display:flex;justify-content:space-between;font-weight:600;font-size:15px}.hd span{font-weight:400;font-size:12px;color:#86909c}
.it{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:12px 0;border-top:1px solid #f0f1f3}
.it i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#fff;background:#e5e6eb;transform:scale(.6);transition:background .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.it.on i{background:#00b42a;transform:none}
.it b{font-size:17px;white-space:nowrap}.it small{display:block;margin-top:8px;padding:8px 12px;border-radius:9px;background:#f5f7fa;font-size:13px;color:#4e5969;opacity:0;transition:opacity .4s}
.it.on small{opacity:1}.it small em{font-style:normal;font-weight:600;color:#165dff;margin-right:6px}
.go{margin-top:12px;display:inline-block;padding:8px 18px;border-radius:99px;background:#165dff;color:#fff;font-weight:600;opacity:0;transition:opacity .4s}.go.on{opacity:1}
</style></head>
<body class="light" data-steps="4" data-caps="标准一：现有依据够不够|标准二：未知有没有处理办法|标准三：再补信息会不会改变决定|三条都满足：可以推进">
<div class="stage"><p class="eb" style="color:#b5482b">示例 · 去业务化</p></div>
<div class="side"><h2>三条都满足，<br><em>就可以推进。</em></h2><p>标准挂在具体案例上讲，<br>每条下面放“本例”的事实。</p></div>
<div class="card"><div class="hd">够了吗？<span>三条都打勾，就可以推进</span></div>
 <div class="it" data-s="0"><i>✓</i><div><b>现有依据，能支持当前取舍</b><small><em>本例</em>两个任务已分清，用户本来就有替代办法</small></div></div>
 <div class="it" data-s="1"><i>✓</i><div><b>关键未知，已有处理办法</b><small><em>做法</em>写进需求单“待确认”，标上谁跟进</small></div></div>
 <div class="it" data-s="2"><i>✓</i><div><b>再补信息，也不会改变本轮决定</b><small><em>本例</em>值得补的那条已经补了</small></div></div>
 <div class="go" data-s="3">可以推进 →</div></div>
<p class="note">内容为示意</p><script src="demo.js"></script></body></html>
