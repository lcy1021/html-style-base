<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>滚动叙事</title><link rel="stylesheet" href="demo.css">
<style>
.txt{position:absolute;left:34px;top:130px;width:34%}
.txt div{position:absolute;top:0;left:0;right:0;opacity:0;transform:translateY(30px)}
.txt div.on{opacity:1;transform:none}
.txt small{color:var(--amber);font-size:12px;letter-spacing:.1em}.txt h3{font-size:22px;font-weight:500;margin:8px 0 10px;line-height:1.4}.txt p{color:var(--mut);line-height:1.8;font-size:15px}
.scr{position:absolute;right:34px;top:110px;width:54%;height:calc(100% - 200px);background:#fff;color:#1d2129;border-radius:14px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.4);overflow:hidden}
.scr h4{font-size:15px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e5e6eb;border-radius:8px;margin-bottom:8px;font-size:14px;transition:all .6s var(--ease)}
.row i{width:14px;height:14px;border-radius:50%;border:2px solid #c9cdd4;flex:none;transition:.4s}
.row.pick{border-color:#5b4bff;background:#f3f1ff}.row.pick i{border-color:#5b4bff;background:#5b4bff}
.row.pain{border-color:#ff6b5a;background:#fff3f1}
.tag{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:99px;background:#fff3f1;color:#e5483a;opacity:0;transition:.4s}.tag.on{opacity:1}
.new{max-height:0;overflow:hidden;transition:max-height .7s var(--ease),opacity .5s;opacity:0}.new.on{max-height:200px;opacity:1}
.sub{margin:4px 0 8px 24px;font-size:13px;color:#4e5969;display:grid;grid-template-columns:1fr 1fr;gap:6px}.sub span{border:1px dashed #c9cdd4;border-radius:6px;padding:6px 8px}
</style></head>
<body data-steps="4" data-caps="画面固定在右边，文字一段段滚过|第二段：同一个画面，标出问题|第三段：画面原地变成方案|第四段：方案的完成标准">
<div class="stage"><p class="eb">示例 · 去业务化</p><h1>同一个画面，<em>从现状走到方案。</em></h1></div>
<div class="txt">
 <div data-s="0-0"><small>现状</small><h3>导出时，只能选“合并”或“拆分”。</h3><p>右边是现在的导出设置。先让大家看清起点，不急着评价。</p></div>
 <div data-s="1-1"><small>问题</small><h3>拆完以后，文件名都一样。</h3><p>收到文件的人分不清哪个是哪个部门的，还得一个个打开看。</p></div>
 <div data-s="2-2"><small>方案</small><h3>拆分时一起决定命名和去向。</h3><p>还是同一个面板，只在“拆分”下面展开两项设置。</p></div>
 <div data-s="3"><small>完成标准</small><h3>拿到文件的人，不打开就知道是谁的。</h3><p>标准写成用户能检查的结果，而不是“支持了某个选项”。</p></div>
</div>
<div class="scr"><h4>导出报表</h4>
 <div class="row"><i></i>合并为一个文件</div>
 <div class="row pick" id="r2"><i></i>按部门拆分为多个文件<span class="tag" id="tg">文件名都一样</span></div>
 <div class="new" id="nw"><div class="sub"><span>文件名：部门 + 月份</span><span>打包为一个压缩包</span></div></div>
 <div class="row"><i></i>仅导出当前筛选</div>
</div>
<p class="note">内容为示意</p>
<script src="demo.js"></script>
<script>window.onStep=k=>{r2.classList.toggle('pain',k===1);tg.classList.toggle('on',k===1);nw.classList.toggle('on',k>=2);};</script>
</body></html>
