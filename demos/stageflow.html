<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阶段曲线 stageflow</title><link rel="stylesheet" href="demo.css">
<style>
.cv{position:absolute;left:6%;right:6%;top:110px;height:90px}
.cv svg{width:100%;height:100%;overflow:visible}.cv path{fill:none;stroke-width:3;vector-effect:non-scaling-stroke}
.bg{stroke:rgba(255,255,255,.2);stroke-dasharray:6 8}.fg{stroke:var(--violet);stroke-dasharray:100;transition:stroke-dashoffset 1s var(--ease)}
.nd{position:absolute;transform:translate(-50%,-50%);text-align:center}.nd i{display:block;width:20px;height:20px;margin:0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:var(--bg);transition:.4s}.nd b{display:block;margin-top:6px;font-size:13px;color:var(--mut)}
.nd.on i{background:#fff;border-color:#fff;box-shadow:0 0 0 7px rgba(185,168,255,.25)}.nd.on b{color:#fff}
.body{position:absolute;left:34px;right:34px;top:240px;bottom:72px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar{display:flex;height:34px;border-radius:10px;overflow:hidden}.bar span{transition:flex .8s var(--ease);font-size:11px;display:grid;place-items:center;color:#fff;overflow:hidden;white-space:nowrap}
.q{margin-top:12px;padding:16px 18px;border-radius:14px;background:#fff;color:#1d2129}.q small{font-size:11px;color:#86909c}.q h4{margin-top:6px;font-size:19px;line-height:1.4}
.need{border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}.need small{font-size:11px;color:var(--amber)}
.need li{list-style:none;margin-top:8px;padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.05);font-size:14px}
</style></head>
<body data-steps="3" data-caps="阶段 1：靠假设推进|阶段 2：常用任务能直接完成|阶段 3：存量与迁移成本">
<div class="stage"><p class="eb">示例 · 去业务化</p><h1>产品走到哪个阶段，<em>要判断的就不一样。</em></h1></div>
<div class="cv"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="bg" d="M2,90 C30,90 35,80 50,50 S80,10 98,8"/><path class="fg" id="fg" pathLength="100" d="M2,90 C30,90 35,80 50,50 S80,10 98,8"/></svg>
 <div class="nd" style="left:2%;top:90%"><i></i><b>起步期</b></div><div class="nd" style="left:50%;top:50%"><i></i><b>增长期</b></div><div class="nd" style="left:98%;top:8%"><i></i><b>成熟期</b></div></div>
<div class="body">
 <div><div class="bar" id="bar"><span style="background:#6f6a7a">内部假设</span><span style="background:#2f7be0">规划</span><span style="background:#e8692a">用户反馈</span></div>
  <div class="q"><small>这个阶段，最需要判断的</small><h4 id="qq"></h4></div></div>
 <div class="need"><small>这个阶段，主要关注的需求</small><ul id="nn"></ul></div>
</div>
<p class="note">构成为示意趋势，不是统计</p><script src="demo.js"></script>
<script>const W=[[7,2,1],[3,5,3],[2,3,6]],Q=['谁会用？最需要验证哪个假设？','常用任务，能不能直接完成？','改动会怎样影响已有配置和习惯？'],L=[['先验证的核心场景','最该先验证的假设','能力边界'],['高频任务不绕路','诉求变多先分层','方案变多做推演'],['对存量的影响','上线后能否挽回','新旧并存定终点']];
window.onStep=k=>{document.getElementById('fg').style.strokeDashoffset=100-[4,50,100][k];document.querySelectorAll('.nd').forEach((n,i)=>n.classList.toggle('on',i===k));[...document.querySelectorAll('#bar span')].forEach((s,i)=>s.style.flex=W[k][i]);document.getElementById('qq').textContent=Q[k];document.getElementById('nn').innerHTML=L[k].map(t=>`<li>${t}</li>`).join('');};</script>
</body></html>
