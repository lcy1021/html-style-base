<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填入式记录</title><link rel="stylesheet" href="demo.css">
<style>
.t{position:absolute;right:34px;top:110px;width:min(600px,60vw);border-radius:14px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.1);overflow:hidden}
.row{display:grid;grid-template-columns:130px 1fr;border-top:1px solid #f0f1f3;font-size:14px}.row b{padding:11px 14px;background:#fafbfc;color:#4e5969;font-weight:500}
.v{padding:11px 14px;color:#c9cdd4;transition:color .4s}.v.f{color:#1d2129}
.one{position:absolute;left:34px;right:calc(min(600px,60vw) + 70px);top:150px;font-size:18px;line-height:1.8;color:#4e5969}
.one i{font-style:normal;padding:1px 6px;border-radius:5px;background:#eef3ff;color:#165dff;opacity:.35;transition:opacity .4s}.one i.f{opacity:1}
</style></head>
<body class="light" data-steps="3" data-caps="空白模板|填入事实三行|填入下一步三行，再浓缩成一句话">
<div class="stage"><p class="eb" style="color:#b5482b">示例 · 去业务化</p><h1>不需要长文档，<em style="color:#5b3fd6">一份简短记录就够。</em></h1></div>
<div class="t" id="t"></div>
<p class="one" data-s="2">对于<i>财务</i>在<i>月底对账</i>时遇到的<i>按部门拆数据费时</i>，还需要确认<i>拆完后的提交方式</i>，建议<i>先和财务确认归档要求</i>。</p>
<p class="note">内容为示意</p><script src="demo.js"></script>
<script>const R=[['原始诉求','导出时按部门生成文件'],['场景','月底对账，十几个部门'],['已知困难','逐个筛选、逐个导出'],['关键未知','拆完后怎么提交'],['初步方向','先保留拆分，补命名规则'],['下一步','周三前和财务确认']];
t.innerHTML=R.map((r,i)=>`<div class="row"><b>${r[0]}</b><span class="v" data-v="${r[1]}">待填写</span></div>`).join('');
window.onStep=k=>{[...t.querySelectorAll('.v')].forEach((v,i)=>{const on=(k>=1&&i<3)||(k>=2);v.textContent=on?v.dataset.v:'待填写';v.classList.toggle('f',on);});document.querySelectorAll('.one i').forEach(i=>i.classList.toggle('f',k>=2));};</script>
</body></html>
