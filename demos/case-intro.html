<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三拍递进的案例开场</title><link rel="stylesheet" href="demo.css">
<style>
.a{position:absolute;inset:110px 34px 20px;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}
[data-s]{opacity:0;transform:translateY(10px)}[data-s].on{opacity:1;transform:none}
.slot{position:absolute;inset:110px 34px 20px}
.bg h2{font-size:26px;font-weight:400;line-height:1.3}.bg h2 em{font-style:normal;color:var(--violet)}.bg p{margin-top:12px;color:var(--mut);line-height:1.8}
.sticky{padding:22px 24px;border-radius:14px;background:var(--amber);color:#2a1a00;transform:rotate(1.2deg)}
.sticky small{font-size:11px;font-weight:700;opacity:.7}.sticky b{display:block;margin-top:6px;font-size:22px;line-height:1.4}
.dlg{background:#fff;color:#1d2129;border-radius:14px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.dlg h4{font-size:15px;margin-bottom:12px}.opt{padding:9px 12px;border:1px solid #e5e6eb;border-radius:8px;margin-top:8px;font-size:14px}.opt.pick{border-color:#5b3fd6;background:#f4f1ff}
.q{padding:12px 16px;border-radius:12px;border:1px solid rgba(185,168,255,.3);background:rgba(255,255,255,.05);font-size:18px;margin-top:10px}.q b{color:var(--violet)}
.lit{font-size:20px;line-height:1.5}
</style></head>
<body data-steps="3" data-caps="第一拍：案例背景——这是谁、在做什么|第二拍：照字面理解，改动只是一个选项|第三拍：动手之前，先问三个问题">
<div class="stage"><p class="eb">示例 · 去业务化</p><h1>开始设计前，先问<em>要解决什么。</em></h1></div>
<div class="slot a" data-s="0-0">
 <div class="bg"><p class="eb">案例背景</p><h2>财务每月要<br>按部门<em>对账。</em></h2><p>需要材料时，会在报表里筛出全部门数据，用“导出”生成文件。</p></div>
 <div class="sticky"><small>用户提出</small><b>“导出时，每个部门<br>生成一个文件。”</b></div>
</div>
<div class="slot a" data-s="1-1">
 <div class="dlg"><h4>导出报表</h4><div class="opt">合并为一个文件</div><div class="opt pick">● 按部门拆分为多个文件</div></div>
 <p class="lit">照字面理解，<br>改动就是这一个选项。</p>
</div>
<div class="slot a" data-s="2">
 <div class="dlg"><h4>导出报表</h4><div class="opt">合并为一个文件</div><div class="opt pick">● 按部门拆分为多个文件</div></div>
 <div><p class="eb">动手之前，先问</p><div class="q">这些文件，<b>给谁</b>？</div><div class="q">拆完以后，<b>要做什么</b>？</div><div class="q">做到什么样，才算<b>完成</b>？</div></div>
</div>
<p class="note">内容为示意</p><script src="demo.js"></script></body></html>
