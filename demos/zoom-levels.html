<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐级放大</title><link rel="stylesheet" href="demo.css">
<style>
.vp{position:absolute;left:34px;right:34px;top:120px;bottom:76px;overflow:hidden;border-radius:14px;background:#15131d}
.world{position:absolute;left:50%;top:50%;width:900px;height:520px;margin:-260px 0 0 -450px;transition:transform 1.1s var(--ease);transform-origin:0 0}
.bx{position:absolute;border:1.5px solid rgba(185,168,255,.5);border-radius:10px;color:var(--mut);font-size:13px;padding:6px 10px}
.bx.cur{border-color:var(--amber);color:var(--fg);box-shadow:0 0 0 4px rgba(255,181,71,.15)}
.lbl{position:absolute;left:24px;bottom:18px;font-size:15px;line-height:1.7;max-width:420px;background:rgba(12,11,18,.8);padding:10px 14px;border-radius:10px}.lbl b{color:var(--amber);margin-right:8px}
</style></head>
<body data-steps="4" data-caps="流程：一张表经过的四个环节|页面：其中一个环节的页面|表单：页面里的一块|按钮：表单里的一个按钮">
<div class="stage"><p class="eb">示例 · 去业务化</p><h1>从流程到按钮，<em>每一级都要说得通。</em></h1></div>
<div class="vp"><div class="world" id="w">
 <div class="bx" id="b0" style="left:0;top:0;width:900px;height:520px">流程</div>
 <div class="bx" id="b1" style="left:320px;top:120px;width:300px;height:220px">页面</div>
 <div class="bx" id="b2" style="left:380px;top:190px;width:150px;height:100px">表单</div>
 <div class="bx" id="b3" style="left:450px;top:250px;width:60px;height:26px;font-size:9px;padding:4px 6px">按钮</div>
</div><div class="lbl" id="lb"></div></div>
<script src="demo.js"></script>
<script>
const B=[[0,0,900,520],[320,120,300,220],[380,190,150,100],[450,250,60,26]],L=['流程：这张表最后要被谁审阅？','页面：审阅的人第一眼要看到总数。','表单：所以汇总区放在顶部，不放在末尾。','按钮：“导出”紧挨汇总，不藏在更多里。'];
window.onStep=k=>{const [x,y,w,h]=B[k],s=Math.min(Math.min(900/w,520/h)*.75,5);w0.style.transform=`translate(${450-(x+w/2)*s}px,${260-(y+h/2)*s}px) scale(${s})`;
 document.querySelectorAll('.bx').forEach((b,i)=>b.classList.toggle('cur',i===k));lb.innerHTML=`<b>${k+1} / 4</b>${L[k]}`;};
const w0=document.getElementById('w');
</script></body></html>
