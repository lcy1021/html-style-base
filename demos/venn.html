<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叠加对比</title><link rel="stylesheet" href="demo.css">
<style>
.vn{position:absolute;left:34px;top:110px;width:58%;bottom:76px}
.ci{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;border:2px solid;opacity:0;transform:scale(.6);transition:.7s var(--ease);display:flex;justify-content:center;padding-top:12px;font-size:13px}
.ci.on{opacity:1;transform:none}
.c1{left:12%;top:0;border-color:var(--teal);background:rgba(90,208,179,.08)}.c2{left:40%;top:0;border-color:var(--violet);background:rgba(185,168,255,.08)}.c3{left:26%;top:28%;border-color:var(--amber);background:rgba(255,181,71,.08);align-items:flex-end;padding-bottom:14px}
.it{position:absolute;font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.12);transition:left .8s var(--ease),top .8s var(--ease),opacity .4s;white-space:nowrap}
.side{position:absolute;right:34px;top:140px;width:30%;font-size:15px;line-height:1.8;color:var(--mut)}.side b{color:var(--fg);display:block;font-size:18px;font-weight:500;margin-bottom:6px}
</style></head>
<body data-steps="4" data-caps="第一个样本的条件|加入第二个样本，共同条件自动落进重叠区|加入第三个样本|三者都有的，才是共性">
<div class="stage"><p class="eb">示例 · 去业务化</p><h1>几个样本放在一起，<em>共性自己会浮出来。</em></h1></div>
<div class="vn" id="vn"><div class="ci c1" data-s="0">样本甲</div><div class="ci c2" data-s="1">样本乙</div><div class="ci c3" data-s="2">样本丙</div></div>
<div class="side" id="sd"></div>
<p class="note">内容为示意 · 条目可换成任务 / 数据结构 / 组织流程</p>
<script src="demo.js"></script>
<script>
// [文字, 所属样本集合]
const I=[['按月汇总',[0,1,2]],['多级审批',[0,1]],['跨部门共享',[0,2]],['字段很多',[1,2]],['只看总数',[0]],['有外部协作',[1]],['数据量大',[2]]];
const pos={'0':[14,20],'1':[66,20],'2':[40,78],'0,1':[41,10],'0,2':[25,48],'1,2':[55,48],'0,1,2':[41,36]};
vn.insertAdjacentHTML('beforeend',I.map(([t])=>`<div class="it">${t}</div>`).join(''));
const its=[...vn.querySelectorAll('.it')];
const S=['只有一个样本时，看不出哪些是共性。','两个都有的条件，自动落进重叠区。','第三个样本加入后，重叠区又被筛了一次。','<b>三个都有：按月汇总</b>只在一个样本里出现的，先别当成普遍需求。'];
window.onStep=k=>{const used={};its.forEach((e,i)=>{const own=I[i][1].filter(x=>x<=Math.min(k,2));if(!own.length){e.style.opacity=0;return}e.style.opacity=1;const key=own.join(','),p=pos[key],n=used[key]=(used[key]||0)+1;e.style.left=p[0]+'%';e.style.top=(p[1]+(n-1)*7)+'%';e.style.color=k>=3&&I[i][1].length===3?'var(--amber)':'';});sd.innerHTML=S[k].startsWith('<b>')?S[k]:'<b>'+['样本甲','+ 样本乙','+ 样本丙'][Math.min(k,2)]+'</b>'+S[k];};
</script></body></html>
